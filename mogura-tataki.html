<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>もぐらたたき</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #8FCB6B; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic", sans-serif;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    color: #3A5228;
  }
  #game { display: block; width: 100%; height: 100%; }

  .ui {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    background: rgba(58, 82, 40, 0.82); color: #F7F5E8;
  }
  .ui.hidden { display: none; }
  h1 { font-size: 34px; letter-spacing: 0.1em; }
  .sub { margin-top: 14px; font-size: 15px; line-height: 2; opacity: 0.95; }
  .rule { display: flex; gap: 18px; margin-top: 18px; font-size: 14px; font-weight: bold; }
  .rule span { background: rgba(247,245,232,0.15); border-radius: 12px; padding: 8px 12px; }
  .tap {
    margin-top: 28px; font-size: 17px; font-weight: bold;
    padding: 14px 44px; border-radius: 999px; border: none;
    background: #F7B32B; color: #4A3208;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  .result-score { font-size: 76px; font-weight: bold; line-height: 1.1; }
  .result-label { font-size: 13px; letter-spacing: 0.3em; opacity: 0.85; }
  .new-record { color: #F7B32B; font-weight: bold; margin-top: 10px; font-size: 17px; }

  .home-btn {
    position: fixed; top: 12px; right: 12px; z-index: 999;
    font-size: 12px; font-weight: bold;
    padding: 8px 13px; border-radius: 999px;
    background: rgba(58,82,40,0.16); color: #3A5228;
    text-decoration: none;
  }
  .home-btn:active { background: rgba(58,82,40,0.32); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<a class="home-btn" href="index.html">☰ 一覧</a>

<div id="title" class="ui">
  <h1>もぐらたたき</h1>
  <div class="sub">30秒でスコアをかせぎましょう。<br>あなの中から出てくるモグラをタップ!</div>
  <div class="rule">
    <span>🟤 +10</span>
    <span>🟡 +30</span>
    <span>💣 −20</span>
  </div>
  <button class="tap" id="startBtn">スタート!</button>
</div>

<div id="result" class="ui hidden">
  <div class="result-label">スコア</div>
  <div class="result-score" id="finalScore">0</div>
  <div class="new-record hidden" id="newRecord">✦ 自己ベスト更新! ✦</div>
  <div class="sub" id="resultMsg"></div>
  <button class="tap" id="retryBtn">もういちど</button>
</div>

<script>
(() => {
  const GAME_TIME = 30;
  const COLS = 3, ROWS = 3;

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const titleEl = document.getElementById('title');
  const resultEl = document.getElementById('result');

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- 効果音(合成音・ファイル不要) ----
  let audio = null;
  function initAudio() {
    try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  function beep(freq, dur, type = 'square', vol = 0.15) {
    if (!audio) return;
    try {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
      o.connect(g); g.connect(audio.destination);
      o.start(); o.stop(audio.currentTime + dur);
    } catch (e) {}
  }

  // ---- 状態 ----
  let state = 'title';       // title | play | result
  let score = 0, best = 0, timeLeft = GAME_TIME;
  let holes = [];            // 各あな: null または {type, phase, t, hit}
  let spawnTimer = 0;
  let floats = [];           // スコア表示
  let elapsed = 0;

  function holePositions() {
    const areaTop = H * 0.2, areaBottom = H * 0.92;
    const cw = W / COLS, ch = (areaBottom - areaTop) / ROWS;
    const r = Math.min(cw, ch) * 0.32;
    const pos = [];
    for (let row = 0; row < ROWS; row++)
      for (let col = 0; col < COLS; col++)
        pos.push({ x: cw * (col + 0.5), y: areaTop + ch * (row + 0.72), r });
    return pos;
  }

  function reset() {
    score = 0; timeLeft = GAME_TIME; elapsed = 0;
    holes = Array(COLS * ROWS).fill(null);
    spawnTimer = 0.4; floats = [];
  }

  function spawn() {
    const empty = holes.map((h, i) => h ? -1 : i).filter(i => i >= 0);
    if (!empty.length) return;
    const i = empty[Math.floor(Math.random() * empty.length)];
    const r = Math.random();
    const type = r < 0.62 ? 'mole' : r < 0.82 ? 'gold' : 'bomb';
    holes[i] = { type, phase: 'rise', t: 0, hit: false };
  }

  function whack(i) {
    const m = holes[i];
    if (!m || m.hit || m.phase === 'sink') return;
    m.hit = true; m.phase = 'hit'; m.t = 0;
    const pos = holePositions()[i];
    let pts, col;
    if (m.type === 'mole') { pts = 10; col = '#5B3A1E'; beep(660, 0.09); }
    else if (m.type === 'gold') { pts = 30; col = '#B8860B'; beep(990, 0.12, 'square', 0.18); }
    else { pts = -20; col = '#C0392B'; beep(120, 0.3, 'sawtooth', 0.2); }
    score = Math.max(0, score + pts);
    floats.push({ x: pos.x, y: pos.y - pos.r * 1.6, msg: (pts > 0 ? '+' : '') + pts, col: pts > 0 ? '#FFFFFF' : '#FFD1CC', life: 1 });
  }

  function endGame() {
    state = 'result';
    document.getElementById('finalScore').textContent = score;
    const isRecord = score > best;
    if (isRecord) best = score;
    document.getElementById('newRecord').classList.toggle('hidden', !isRecord);
    document.getElementById('resultMsg').textContent =
      score >= 400 ? 'モグラたたきの達人です!' :
      score >= 250 ? 'すばらしい反射神経!' :
      score >= 120 ? 'いい調子です。' : '金のモグラを狙ってみましょう。';
    beep(520, 0.15); setTimeout(() => beep(660, 0.2), 150);
    setTimeout(() => resultEl.classList.remove('hidden'), 400);
  }

  // ---- 描画 ----
  function moleHeight(m) {
    // 0(かくれている)〜1(全部出ている)
    if (!m) return 0;
    if (m.phase === 'rise') return Math.min(m.t / 0.13, 1);
    if (m.phase === 'hold') return 1;
    if (m.phase === 'sink') return Math.max(1 - m.t / 0.15, 0);
    if (m.phase === 'hit') return Math.max(1 - m.t / 0.35, 0);
    return 0;
  }

  function drawMole(p, m) {
    const hgt = moleHeight(m);
    if (hgt <= 0) return;
    const r = p.r;
    const bodyH = r * 2.1 * hgt;
    const squish = m.phase === 'hit' ? 0.7 : 1;

    ctx.save();
    // あなから下は見えないようにクリップ
    ctx.beginPath();
    ctx.rect(p.x - r * 1.6, p.y - r * 3.2, r * 3.2, r * 3.2);
    ctx.clip();

    const cx = p.x, top = p.y - bodyH * squish;
    const bw = r * 0.95;
    const col = m.type === 'mole' ? '#8B5A2B' : m.type === 'gold' ? '#F7B32B' : '#3B3B3B';

    // 体
    ctx.beginPath();
    ctx.moveTo(cx - bw, p.y + r);
    ctx.lineTo(cx - bw, top + bw);
    ctx.arc(cx, top + bw, bw, Math.PI, 0);
    ctx.lineTo(cx + bw, p.y + r);
    ctx.closePath();
    ctx.fillStyle = col;
    ctx.fill();

    if (m.type === 'bomb') {
      // 導火線
      ctx.strokeStyle = '#C08A3E';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(cx, top);
      ctx.quadraticCurveTo(cx + r * 0.3, top - r * 0.35, cx + r * 0.15, top - r * 0.5);
      ctx.stroke();
      ctx.fillStyle = '#F7B32B';
      ctx.beginPath();
      ctx.arc(cx + r * 0.15, top - r * 0.5, 4, 0, Math.PI * 2);
      ctx.fill();
      // 顔(こわい)
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath(); ctx.arc(cx - r * 0.3, top + bw * 0.9, r * 0.1, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + r * 0.3, top + bw * 0.9, r * 0.1, 0, Math.PI * 2); ctx.fill();
    } else {
      // 耳
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(cx - bw * 0.7, top + bw * 0.25, r * 0.22, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + bw * 0.7, top + bw * 0.25, r * 0.22, 0, Math.PI * 2); ctx.fill();
      // 顔まわり
      ctx.fillStyle = m.type === 'gold' ? '#FCE8B8' : '#D9B38C';
      ctx.beginPath();
      ctx.ellipse(cx, top + bw * 1.05, bw * 0.62, bw * 0.5, 0, 0, Math.PI * 2);
      ctx.fill();
      // 目
      ctx.fillStyle = '#2B1B0E';
      if (m.phase === 'hit') {
        ctx.lineWidth = 2.5; ctx.strokeStyle = '#2B1B0E';
        const e = r * 0.1;
        for (const dx of [-r * 0.28, r * 0.28]) {
          ctx.beginPath();
          ctx.moveTo(cx + dx - e, top + bw * 0.85 - e); ctx.lineTo(cx + dx + e, top + bw * 0.85 + e);
          ctx.moveTo(cx + dx + e, top + bw * 0.85 - e); ctx.lineTo(cx + dx - e, top + bw * 0.85 + e);
          ctx.stroke();
        }
      } else {
        ctx.beginPath(); ctx.arc(cx - r * 0.28, top + bw * 0.85, r * 0.09, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx + r * 0.28, top + bw * 0.85, r * 0.09, 0, Math.PI * 2); ctx.fill();
      }
      // 鼻
      ctx.fillStyle = '#E8626A';
      ctx.beginPath(); ctx.arc(cx, top + bw * 1.05, r * 0.13, 0, Math.PI * 2); ctx.fill();
      // ひげ
      ctx.strokeStyle = 'rgba(43,27,14,0.5)';
      ctx.lineWidth = 1.5;
      for (const d of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(cx + d * r * 0.2, top + bw * 1.1); ctx.lineTo(cx + d * r * 0.65, top + bw * 1.0);
        ctx.moveTo(cx + d * r * 0.2, top + bw * 1.18); ctx.lineTo(cx + d * r * 0.65, top + bw * 1.25);
        ctx.stroke();
      }
    }

    // たたかれた星
    if (m.phase === 'hit' && m.type !== 'bomb') {
      ctx.fillStyle = '#FFE066';
      for (let k = 0; k < 5; k++) {
        const a = m.t * 6 + k * (Math.PI * 2 / 5);
        const rr = r * 0.9 + m.t * r * 1.6;
        ctx.beginPath();
        ctx.arc(cx + Math.cos(a) * rr, top + bw * 0.5 + Math.sin(a) * rr * 0.5, 3.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    if (m.phase === 'hit' && m.type === 'bomb') {
      // 爆発
      ctx.fillStyle = `rgba(240, 90, 40, ${Math.max(0.7 - m.t * 2, 0)})`;
      ctx.beginPath();
      ctx.arc(cx, top + bw, r * (1 + m.t * 3), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  let lastNow = 0;
  function draw(now) {
    const dt = Math.min((now - lastNow) / 1000, 0.05);
    lastNow = now;

    // 背景
    ctx.fillStyle = '#8FCB6B';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#7FBC5C';
    for (let i = 0; i < 12; i++) {
      const gx = (i * 173) % W, gy = H * 0.16 + ((i * 97) % Math.round(H * 0.8));
      ctx.beginPath();
      ctx.ellipse(gx, gy, 26, 9, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    const pos = holePositions();

    if (state === 'play') {
      elapsed += dt;
      timeLeft = Math.max(0, GAME_TIME - elapsed);

      // 出現ペース(だんだん速くなる)
      spawnTimer -= dt;
      const interval = 0.95 - 0.5 * (elapsed / GAME_TIME);
      if (spawnTimer <= 0) {
        spawn();
        if (elapsed > GAME_TIME * 0.6 && Math.random() < 0.4) spawn(); // 終盤は2匹同時も
        spawnTimer = interval;
      }

      // モグラの状態更新
      const holdTime = 0.9 - 0.35 * (elapsed / GAME_TIME);
      holes.forEach((m, i) => {
        if (!m) return;
        m.t += dt;
        if (m.phase === 'rise' && m.t >= 0.13) { m.phase = 'hold'; m.t = 0; }
        else if (m.phase === 'hold') {
          const limit = m.type === 'gold' ? holdTime * 0.55 : holdTime;
          if (m.t >= limit) { m.phase = 'sink'; m.t = 0; }
        }
        else if (m.phase === 'sink' && m.t >= 0.15) holes[i] = null;
        else if (m.phase === 'hit' && m.t >= 0.35) holes[i] = null;
      });

      if (timeLeft <= 0) endGame();
    }

    // あな
    for (const p of pos) {
      ctx.fillStyle = '#6B4A2B';
      ctx.beginPath();
      ctx.ellipse(p.x, p.y + p.r * 0.15, p.r * 1.25, p.r * 0.55, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#3E2A16';
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, p.r * 1.1, p.r * 0.45, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // モグラ(あなの奥から出てくる)
    holes.forEach((m, i) => { if (m) drawMole(pos[i], m); });

    // あなの手前のふち(モグラの根本を隠す)
    for (const p of pos) {
      ctx.fillStyle = '#6B4A2B';
      ctx.beginPath();
      ctx.ellipse(p.x, p.y + p.r * 0.28, p.r * 1.25, p.r * 0.42, 0, 0, Math.PI);
      ctx.fill();
    }

    // スコアフロート
    for (const f of floats) {
      f.life -= dt * 1.3;
      ctx.globalAlpha = Math.max(f.life, 0);
      ctx.fillStyle = f.col;
      ctx.font = 'bold 24px "Hiragino Maru Gothic ProN", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(f.msg, f.x, f.y - (1 - f.life) * 36);
      ctx.globalAlpha = 1;
    }
    floats = floats.filter(f => f.life > 0);

    // HUD
    if (state === 'play' || state === 'result') {
      ctx.textAlign = 'left';
      ctx.fillStyle = '#3A5228';
      ctx.font = 'bold 24px "Hiragino Maru Gothic ProN", sans-serif';
      ctx.fillText(score, 18, 44);
      ctx.font = '12px sans-serif';
      ctx.fillText(`ベスト ${best}`, 18, 62);
      ctx.textAlign = 'center';
      const urgent = timeLeft <= 5;
      ctx.fillStyle = urgent ? '#C0392B' : '#3A5228';
      ctx.font = `bold ${urgent ? 40 : 32}px "Hiragino Maru Gothic ProN", sans-serif`;
      ctx.fillText(Math.ceil(timeLeft), W / 2, 50);
    }

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(t => { lastNow = t; requestAnimationFrame(draw); });

  // ---- 入力 ----
  canvas.addEventListener('pointerdown', e => {
    if (state !== 'play') return;
    const pos = holePositions();
    for (let i = 0; i < pos.length; i++) {
      const p = pos[i];
      const m = holes[i];
      if (!m) continue;
      const top = p.y - p.r * 2.1 * moleHeight(m);
      if (e.clientX >= p.x - p.r * 1.3 && e.clientX <= p.x + p.r * 1.3 &&
          e.clientY >= top - p.r * 0.4 && e.clientY <= p.y + p.r * 0.6) {
        whack(i);
        return;
      }
    }
  });

  document.getElementById('startBtn').addEventListener('pointerdown', () => {
    initAudio();
    titleEl.classList.add('hidden');
    reset();
    state = 'play';
    beep(440, 0.1); setTimeout(() => beep(660, 0.12), 120);
  });
  document.getElementById('retryBtn').addEventListener('pointerdown', () => {
    resultEl.classList.add('hidden');
    reset();
    state = 'play';
    beep(440, 0.1); setTimeout(() => beep(660, 0.12), 120);
  });
})();
</script>
</body>
</html>
