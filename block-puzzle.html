<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ブロックパズル</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #1C2340; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic", sans-serif;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #game { display: block; width: 100%; height: 100%; }
  .ui {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    color: #F2F0FF; background: rgba(20, 26, 54, 0.86); pointer-events: none;
  }
  .ui.hidden { display: none; }
  h1 { font-size: 32px; letter-spacing: 0.06em; }
  .sub { margin-top: 14px; font-size: 15px; line-height: 2; opacity: 0.92; }
  .tap {
    margin-top: 30px; font-size: 16px; font-weight: bold;
    padding: 13px 36px; border-radius: 999px;
    background: #FFB454; color: #4A2E00;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .result-score { font-size: 76px; font-weight: bold; line-height: 1.1; }
  .result-label { font-size: 13px; letter-spacing: 0.3em; opacity: 0.85; }
  .new-record { color: #FFB454; font-weight: bold; margin-top: 10px; font-size: 17px; }

  .home-btn {
    position: fixed; top: 12px; left: 12px; z-index: 999;
    font-size: 12px; font-weight: bold;
    padding: 8px 13px; border-radius: 999px;
    background: rgba(242,240,255,0.14); color: #F2F0FF;
    text-decoration: none;
  }
  .home-btn:active { background: rgba(242,240,255,0.28); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<a class="home-btn" id="homeBtn" href="index.html">☰ 一覧</a>

<div id="title" class="ui">
  <h1>ブロックパズル</h1>
  <div class="sub">下の3つのピースをドラッグして盤面へ。<br>タテかヨコの列がそろうと消えます。<br>置き場所がなくなったらゲームオーバー。</div>
  <div class="tap">タップしてスタート</div>
</div>

<div id="over" class="ui hidden">
  <div class="result-label">スコア</div>
  <div class="result-score" id="finalScore">0</div>
  <div class="new-record hidden" id="newRecord">✦ 自己ベスト更新! ✦</div>
  <div class="sub" id="overMsg"></div>
  <div class="tap">タップしてもういちど</div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const titleEl = document.getElementById('title');
  const overEl = document.getElementById('over');
  const finalEl = document.getElementById('finalScore');
  const newRecordEl = document.getElementById('newRecord');
  const overMsg = document.getElementById('overMsg');

  let W = 0, H = 0, DPR = 1;
  const N = 8;                       // 盤面 8x8
  let cell = 40, gridX = 0, gridY = 0, trayY = 0, traySlotW = 0;

  function layout() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cell = Math.floor(Math.min((W - 28) / N, (H * 0.5) / N));
    gridX = Math.round((W - cell * N) / 2);
    gridY = Math.round(H * 0.14);
    trayY = gridY + cell * N + Math.round(H * 0.045);
    traySlotW = Math.floor((W - 24) / 3);
  }
  window.addEventListener('resize', layout);
  layout();

  // ---- ピース定義 ----
  const SHAPES = [
    { c: [[0,0]], col: '#FFD166' },
    { c: [[0,0],[0,1]], col: '#F4A261' },
    { c: [[0,0],[1,0]], col: '#F4A261' },
    { c: [[0,0],[0,1],[0,2]], col: '#EF6461' },
    { c: [[0,0],[1,0],[2,0]], col: '#EF6461' },
    { c: [[0,0],[0,1],[0,2],[0,3]], col: '#E05780' },
    { c: [[0,0],[1,0],[2,0],[3,0]], col: '#E05780' },
    { c: [[0,0],[0,1],[0,2],[0,3],[0,4]], col: '#B565D8' },
    { c: [[0,0],[1,0],[2,0],[3,0],[4,0]], col: '#B565D8' },
    { c: [[0,0],[0,1],[1,0],[1,1]], col: '#5FA8D3' },
    { c: [[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2]], col: '#4C9F70' },
    { c: [[0,0],[1,0],[1,1]], col: '#62C9C3' },
    { c: [[0,1],[1,0],[1,1]], col: '#62C9C3' },
    { c: [[0,0],[0,1],[1,1]], col: '#62C9C3' },
    { c: [[0,0],[0,1],[1,0]], col: '#62C9C3' },
    { c: [[0,0],[1,0],[2,0],[2,1]], col: '#8FB8ED' },
    { c: [[0,1],[1,1],[2,0],[2,1]], col: '#8FB8ED' },
    { c: [[0,0],[0,1],[0,2],[1,1]], col: '#FF9770' },
    { c: [[1,0],[1,1],[1,2],[0,1]], col: '#FF9770' },
    { c: [[0,0],[0,1],[1,0],[1,1],[0,2],[1,2]], col: '#4C9F70' },
    { c: [[0,0],[0,1],[1,0],[1,1],[2,0],[2,1]], col: '#4C9F70' },
  ];

  function makePiece() {
    const s = SHAPES[Math.floor(Math.random() * SHAPES.length)];
    const rows = Math.max(...s.c.map(v => v[0])) + 1;
    const cols = Math.max(...s.c.map(v => v[1])) + 1;
    return { cells: s.c, col: s.col, rows, cols };
  }

  // ---- 状態 ----
  let state = 'title';           // title | play | over
  let board = [];                // null または色文字列
  let tray = [null, null, null];
  let score = 0, best = 0, combo = 0;
  let drag = null;               // {slot, piece, px, py}
  let anims = [];                // 消去アニメ {r, c, col, life}
  let floats = [];               // スコア表示 {x, y, msg, life, col}
  let shake = 0;

  function reset() {
    board = Array.from({ length: N }, () => Array(N).fill(null));
    tray = [makePiece(), makePiece(), makePiece()];
    score = 0; combo = 0; anims = []; floats = []; drag = null;
  }

  function canPlace(p, r, c) {
    for (const [dr, dc] of p.cells) {
      const rr = r + dr, cc = c + dc;
      if (rr < 0 || rr >= N || cc < 0 || cc >= N || board[rr][cc]) return false;
    }
    return true;
  }

  function anyPlacement(p) {
    for (let r = 0; r <= N - p.rows; r++)
      for (let c = 0; c <= N - p.cols; c++)
        if (canPlace(p, r, c)) return true;
    return false;
  }

  function place(p, r, c) {
    for (const [dr, dc] of p.cells) board[r + dr][c + dc] = p.col;
    let gained = p.cells.length;

    // そろった行・列を同時判定
    const fullRows = [], fullCols = [];
    for (let i = 0; i < N; i++) {
      if (board[i].every(v => v)) fullRows.push(i);
      if (board.every(row => row[i])) fullCols.push(i);
    }
    const lines = fullRows.length + fullCols.length;

    if (lines > 0) {
      combo++;
      for (const i of fullRows) for (let j = 0; j < N; j++) { anims.push({ r: i, c: j, col: board[i][j], life: 1 }); board[i][j] = null; }
      for (const j of fullCols) for (let i = 0; i < N; i++) { if (board[i][j]) { anims.push({ r: i, c: j, col: board[i][j], life: 1 }); board[i][j] = null; } }
      const bonus = lines * 10 * lines + (combo > 1 ? combo * 10 : 0);
      gained += bonus;
      shake = 6 + lines * 2;
      const msg = (lines >= 2 ? `${lines}ライン! ` : '') + (combo > 1 ? `コンボ×${combo} ` : '') + `+${bonus}`;
      floats.push({ x: gridX + cell * N / 2, y: gridY + cell * (fullRows[0] ?? 4), msg, life: 1, col: '#FFB454' });
    } else {
      combo = 0;
    }

    score += gained;
  }

  function afterPlace(slot) {
    tray[slot] = null;
    if (tray.every(t => !t)) tray = [makePiece(), makePiece(), makePiece()];
    // 残りピースがどこにも置けなければ終了
    if (tray.filter(Boolean).every(p => !anyPlacement(p))) {
      state = 'over';
      finalEl.textContent = score;
      const isRecord = score > best;
      if (isRecord) best = score;
      newRecordEl.classList.toggle('hidden', !isRecord);
      overMsg.textContent = score >= 1500 ? 'お見事です!' : score >= 600 ? 'いい調子です。' : 'コツは大きいピースから置くことですよ。';
      setTimeout(() => overEl.classList.remove('hidden'), 500);
    }
  }

  // ---- 入力 ----
  function trayRect(slot) {
    const x = 12 + slot * traySlotW;
    return { x, y: trayY, w: traySlotW, h: cell * 2.6 };
  }

  function pointerPos(e) {
    return { x: e.clientX, y: e.clientY };
  }

  document.getElementById('homeBtn').addEventListener('pointerdown', e => e.stopPropagation());

  window.addEventListener('pointerdown', e => {
    const { x, y } = pointerPos(e);
    if (state === 'title') { state = 'play'; titleEl.classList.add('hidden'); reset(); return; }
    if (state === 'over') { state = 'play'; overEl.classList.add('hidden'); reset(); return; }
    for (let i = 0; i < 3; i++) {
      const p = tray[i]; if (!p) continue;
      const r = trayRect(i);
      if (x >= r.x && x <= r.x + r.w && y >= r.y - 10 && y <= r.y + r.h + 10) {
        drag = { slot: i, piece: p, px: x, py: y };
        return;
      }
    }
  });

  window.addEventListener('pointermove', e => {
    if (!drag) return;
    const { x, y } = pointerPos(e);
    drag.px = x; drag.py = y;
  });

  function dragOrigin() {
    // 指の少し上にピースを表示(指で隠れないように)
    const p = drag.piece;
    const w = p.cols * cell, h = p.rows * cell;
    return { x: drag.px - w / 2, y: drag.py - h - 34 };
  }

  function dragCell() {
    const { x, y } = dragOrigin();
    const c = Math.round((x - gridX) / cell);
    const r = Math.round((y - gridY) / cell);
    return { r, c };
  }

  window.addEventListener('pointerup', () => {
    if (!drag) return;
    const { r, c } = dragCell();
    const p = drag.piece, slot = drag.slot;
    drag = null;
    if (canPlace(p, r, c)) {
      place(p, r, c);
      afterPlace(slot);
    }
  });
  window.addEventListener('pointercancel', () => { drag = null; });

  // ---- 描画 ----
  function rounded(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawBlock(x, y, size, col, alpha = 1) {
    ctx.globalAlpha = alpha;
    rounded(x + 1.5, y + 1.5, size - 3, size - 3, size * 0.18);
    ctx.fillStyle = col;
    ctx.fill();
    // ハイライト
    ctx.globalAlpha = alpha * 0.35;
    rounded(x + 4, y + 4, size - 8, (size - 8) * 0.4, size * 0.14);
    ctx.fillStyle = '#FFFFFF';
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function draw(dt) {
    let ox = 0, oy = 0;
    if (shake > 0) {
      ox = (Math.random() - 0.5) * shake;
      oy = (Math.random() - 0.5) * shake;
      shake = Math.max(0, shake - dt * 30);
    }
    ctx.save();
    ctx.translate(ox, oy);

    ctx.fillStyle = '#1C2340';
    ctx.fillRect(-20, -20, W + 40, H + 40);

    // スコア
    ctx.fillStyle = '#F2F0FF';
    ctx.textAlign = 'center';
    ctx.font = `bold ${Math.round(H * 0.05)}px "Hiragino Maru Gothic ProN", sans-serif`;
    ctx.fillText(score, W / 2, gridY - H * 0.035);
    ctx.font = '12px sans-serif';
    ctx.globalAlpha = 0.7;
    ctx.fillText(`ベスト ${best}`, W / 2, gridY - H * 0.008);
    ctx.globalAlpha = 1;

    // 盤面下地
    rounded(gridX - 8, gridY - 8, cell * N + 16, cell * N + 16, 14);
    ctx.fillStyle = '#141A36';
    ctx.fill();
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const x = gridX + c * cell, y = gridY + r * cell;
        rounded(x + 1.5, y + 1.5, cell - 3, cell - 3, cell * 0.16);
        ctx.fillStyle = '#232C52';
        ctx.fill();
        if (board[r] && board[r][c]) drawBlock(x, y, cell, board[r][c]);
      }
    }

    // ドラッグ中のゴースト
    if (drag) {
      const { r, c } = dragCell();
      const ok = canPlace(drag.piece, r, c);
      if (r > -drag.piece.rows && r < N && c > -drag.piece.cols && c < N) {
        for (const [dr, dc] of drag.piece.cells) {
          const rr = r + dr, cc = c + dc;
          if (rr < 0 || rr >= N || cc < 0 || cc >= N) continue;
          const x = gridX + cc * cell, y = gridY + rr * cell;
          rounded(x + 1.5, y + 1.5, cell - 3, cell - 3, cell * 0.16);
          ctx.fillStyle = ok ? 'rgba(255,255,255,0.28)' : 'rgba(239,100,97,0.30)';
          ctx.fill();
        }
      }
    }

    // 消去アニメ
    for (const a of anims) {
      a.life -= dt * 3.2;
      const s = cell * Math.max(a.life, 0);
      const x = gridX + a.c * cell + (cell - s) / 2;
      const y = gridY + a.r * cell + (cell - s) / 2;
      if (s > 1) drawBlock(x, y, s, a.col, a.life);
    }
    anims = anims.filter(a => a.life > 0);

    // トレイ
    for (let i = 0; i < 3; i++) {
      const rect = trayRect(i);
      const p = tray[i];
      if (!p) continue;
      if (drag && drag.slot === i) continue;
      const sc = Math.min(0.52, (rect.w - 16) / (p.cols * cell));
      const pw = p.cols * cell * sc, ph = p.rows * cell * sc;
      const bx = rect.x + (rect.w - pw) / 2;
      const by = rect.y + (rect.h - ph) / 2;
      const placeable = anyPlacement(p);
      for (const [dr, dc] of p.cells) {
        drawBlock(bx + dc * cell * sc, by + dr * cell * sc, cell * sc, p.col, placeable ? 1 : 0.32);
      }
    }

    // ドラッグ中ピース(実寸)
    if (drag) {
      const { x, y } = dragOrigin();
      for (const [dr, dc] of drag.piece.cells) {
        drawBlock(x + dc * cell, y + dr * cell, cell, drag.piece.col, 0.92);
      }
    }

    // スコアフロート
    for (const f of floats) {
      f.life -= dt * 1.1;
      ctx.globalAlpha = Math.max(f.life, 0);
      ctx.fillStyle = f.col;
      ctx.font = `bold ${Math.round(cell * 0.62)}px "Hiragino Maru Gothic ProN", sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText(f.msg, f.x, f.y - (1 - f.life) * 46);
      ctx.globalAlpha = 1;
    }
    floats = floats.filter(f => f.life > 0);

    ctx.restore();
  }

  let lastTime = 0;
  function loop(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    if (state !== 'title') draw(dt);
    else { ctx.fillStyle = '#1C2340'; ctx.fillRect(0, 0, W, H); }
    requestAnimationFrame(loop);
  }
  reset();
  requestAnimationFrame(t => { lastTime = t; requestAnimationFrame(loop); });
})();
</script>
</body>
</html>
